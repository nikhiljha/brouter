<!doctype html>
<!-- DMG window background (640x400 points). Rendered at 1x and 2x by scripts/dmg.sh.
     Icon centers are set in scripts/dmg-settings.py: app (170, 190), Applications (470, 190). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 640px;
    height: 400px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(520px 360px at 0% 0%, #cfe0ff 0%, transparent 60%),
      radial-gradient(480px 360px at 100% 100%, #ffd9c7 0%, transparent 60%),
      radial-gradient(420px 300px at 100% 0%, #e7dcff 0%, transparent 55%),
      #eef0f6;
  }
  svg { position: absolute; left: 270px; top: 170px; }
  p {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 34px;
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
  <svg width="100" height="40" viewBox="0 0 100 40" fill="none">
    <path d="M8 20 H86 M72 8 L88 20 L72 32" stroke="rgba(0,0,0,0.28)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p>Drag brouter to Applications</p>
</body>
</html>
