<!doctype html>
<!-- App icon source (1024x1024, transparent). Rebuild Resources/brouter.icns with scripts/icon.sh. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { width: 1024px; height: 1024px; position: relative; overflow: hidden; }
  /* macOS icon grid: 824px rounded square centered on a 1024px canvas. */
  .tile {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 824px;
    height: 824px;
    border-radius: 185px;
    background:
      radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 55%),
      linear-gradient(145deg, #5b8cff 0%, #7a6cf5 55%, #b07ae8 100%);
    box-shadow:
      inset 0 0 0 2px rgba(255, 255, 255, 0.18),
      0 10px 20px rgba(0, 0, 0, 0.18),
      0 2px 4px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile img {
    width: 440px;
    height: auto;
    filter: drop-shadow(0 8px 14px rgba(40, 20, 120, 0.35));
  }
</style>
</head>
<body>
  <div class="tile"><img src="branch-white.png" alt=""></div>
</body>
</html>
